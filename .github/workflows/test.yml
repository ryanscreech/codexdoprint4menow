name: Package and behaviour tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 has builds for Ubuntu 24.04, but not newer runners.
          - os: ubuntu-24.04
            powershell: pwsh
            python: '3.9'
          - os: macos-latest
            powershell: pwsh
            python: '3.11'
          - os: windows-latest
            powershell: pwsh
            python: '3.11'
          - os: windows-latest
            powershell: powershell
            python: '3.11'
    runs-on: ${{ matrix.os }}
    env:
      CAD_TEST_POWERSHELL: ${{ matrix.powershell }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test with PowerShell 7
        if: matrix.powershell == 'pwsh'
        shell: pwsh
        run: python -m unittest discover -s tests -v
      # Use a native Windows PowerShell parent so Python does not pass
      # incompatible PowerShell 7 module paths to the installer subprocess.
      - name: Test with Windows PowerShell
        if: matrix.powershell == 'powershell'
        shell: powershell
        run: python -m unittest discover -s tests -v
